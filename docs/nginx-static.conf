# Reference only: merge these directives into your existing Nginx server block.
# Replace the root path with the directory containing index.html.
# Validate with nginx -t before reloading an existing server.
server {
    listen 80;
    server_name example.com;
    root /var/www/xbbdyf;
    index index.html;
    include mime.types;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json application/xml application/rss+xml image/svg+xml;

    # HTML can be cached, but must be revalidated before reuse.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    # Built references include a content-based ?v= value. Rebuild after edits.
    location ~* ^/assets/.*\.(?:css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    # Generated article images use a content hash in the filename.
    location ~* ^/assets/images/article-[a-f0-9]+-(?:thumb|body)\.webp$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:webp|png|jpe?g|gif|svg|mp3|mp4)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
