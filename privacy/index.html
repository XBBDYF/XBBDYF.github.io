<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>隐私政策 · 炒股人生模拟器</title>
<meta name="description" content="炒股人生模拟器隐私政策：纯离线单机游戏，不注册账号、不收集、不上传任何个人信息。">
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1b2230; --sub:#5b667a; --line:#e6e9ef;
    --accent:#c9a227;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.75 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:20px 16px 56px;
  }
  .wrap{max-width:760px;margin:0 auto}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:13px}
  .topbar a{color:var(--sub);text-decoration:none;border-bottom:1px dashed transparent;transition:.18s}
  .topbar a:hover{color:var(--ink);border-bottom-color:var(--line)}
  .topbar .raw{opacity:.75}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:24px 22px;box-shadow:0 1px 2px rgba(20,30,50,.04);
  }
  .loading,.err{color:var(--sub);font-size:14px;text-align:center;padding:34px 6px}
  .err a{color:#1a6dd6}

  /* ---------- Markdown 渲染结果 ---------- */
  .md-body{animation:fade .28s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .md-body h1{
    font-size:22px;line-height:1.35;margin:0 0 10px;letter-spacing:.3px;
    padding-bottom:12px;border-bottom:1px solid var(--line);
  }
  /* md 顶部的「应用名称 / 生效日期 / 版本」信息块 */
  .md-body > p:first-of-type{
    color:var(--sub);font-size:12.5px;line-height:1.85;letter-spacing:.2px;margin:0 0 4px;
  }

  .md-body h2{
    font-size:16px;line-height:1.45;margin:28px 0 10px;
    padding-left:10px;border-left:3px solid var(--accent);
  }
  .md-body h3{font-size:15px;margin:20px 0 8px;color:#2b3342}
  .md-body h4{font-size:14.5px;margin:16px 0 6px;color:#2b3342}

  .md-body p{margin:10px 0;color:#2b3342}
  .md-body strong{color:#161d29;font-weight:600}

  .md-body ul,.md-body ol{margin:10px 0;padding-left:22px}
  .md-body li{margin:6px 0;color:#2b3342}
  .md-body li::marker{color:#9aa4b5}
  .md-body ul{list-style:disc}
  .md-body ol{list-style:decimal}

  /* 「一句话说明」引用块 */
  .md-body blockquote{
    margin:14px 0;padding:12px 14px;border-radius:10px;
    background:#fffaf0;border:1px solid #f0e2bd;color:#4a4330;
  }
  .md-body blockquote p{margin:0;color:#4a4330}
  .md-body blockquote strong{color:#8a6d1a}

  .md-body table{
    width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;
    table-layout:auto;word-break:break-word;
  }
  .md-body th,.md-body td{
    border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;
  }
  .md-body th{background:#fafbfc;font-weight:600;white-space:nowrap}
  .md-body tr:nth-child(even) td{background:#fcfcfd}

  .md-body hr{border:0;border-top:1px solid var(--line);margin:26px 0}

  .md-body a{color:#1a6dd6;word-break:break-all;text-decoration:none;border-bottom:1px solid rgba(26,109,214,.28)}
  .md-body a:hover{border-bottom-color:#1a6dd6}

  .md-body code{
    font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
    font-size:.92em;background:#f2f4f7;border:1px solid var(--line);
    border-radius:5px;padding:1px 5px;
  }
  .md-body pre{
    background:#f7f8fa;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;overflow:auto;margin:12px 0;
  }
  .md-body pre code{background:none;border:0;padding:0;font-size:13px}
  .md-body img{max-width:100%;height:auto;border-radius:10px}

  footer{margin-top:24px;color:var(--sub);font-size:12.5px;text-align:center;line-height:1.8}

  @media (max-width:420px){
    body{padding:16px 12px 44px}
    .card{padding:19px 16px;border-radius:12px}
    .md-body h1{font-size:20px}
    .md-body table{font-size:13px}
    .md-body th,.md-body td{padding:7px 8px}
    .md-body th{white-space:normal}
  }
  @media print{
    body{background:#fff;padding:0}
    .topbar,footer{display:none}
    .card{border:0;box-shadow:none;padding:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="../index.html">← 返回首页</a>
    <a class="raw" href="privacy.md">Markdown 源文件</a>
  </div>

  <main class="card" id="policy">
    <div class="loading">正在加载隐私政策…</div>
  </main>

  <footer>
    本页面为「炒股人生模拟器」的隐私政策说明页。
  </footer>
</div>

<script src="../js/marked.min.js"></script>
<script>
(function () {
  var box = document.getElementById('policy');

  function fail(msg) {
    box.innerHTML = '<div class="err">隐私政策加载失败：' + msg +
      '<br><br><a href="privacy.md">点击查看 Markdown 原文</a></div>';
  }

  async function render() {
    try {
      var res = await fetch('privacy.md', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var md = (await res.text()).replace(/^\uFEFF/, '');

      if (typeof marked === 'undefined' || !marked.parse) throw new Error('marked 未加载');

      var html = marked.parse(md, { gfm: true, breaks: true });
      box.innerHTML = '<div class="md-body">' + html + '</div>';

      // 顶部信息块里的邮箱等自动链接无需额外处理；若标题缺失则补一个
      if (!box.querySelector('h1')) {
        var h = document.createElement('h1');
        h.textContent = '隐私政策';
        box.firstChild.insertBefore(h, box.firstChild.firstChild);
      }
    } catch (e) {
      console.error('隐私政策渲染失败:', e);
      fail(e.message || '未知错误');
    }
  }

  render();
})();
</script>
<noscript>
  <div class="wrap"><p style="color:#5b667a">你的浏览器未启用 JavaScript，请查看 <a href="privacy.md">隐私政策原文（Markdown）</a>。</p></div>
</noscript>
</body>
</html>
